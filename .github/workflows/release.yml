name: Release
# When the version in manifest.json changes on main, publish a GitHub release for it.
# Home Assistant's Marketplace sees the new release and offers the update.
on:
  push:
    branches: [main]
    paths: ["custom_components/chorequest/manifest.json", ".github/workflows/release.yml", "RELEASE_NOTES.md"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish release if this version is new
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="v$(python3 -c "import json;print(json.load(open('custom_components/chorequest/manifest.json'))['version'])")"
          if gh release view "$v" >/dev/null 2>&1; then echo "$v already released"; exit 0; fi
          gh release create "$v" --target "$GITHUB_SHA" --title "$v" --notes-file RELEASE_NOTES.md
